# Netlify deployment — https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# SPA: serve index.html for client-side routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
